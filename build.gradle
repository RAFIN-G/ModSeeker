plugins {
    id 'java'
}

group = 'com.example.modseeker'
version = '3.0.0'
def targetJava = (findProperty('java_version') ?: '25').toString().toInteger()
def paperApiVersion = (findProperty('paper_api_version') ?: '26.3.build.222-stable').toString()
def paperApiFamily = (findProperty('paper_api_family') ?: '26.1').toString()

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'opencollab-repo'
        url = 'https://repo.opencollab.dev/main/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJava
}

processResources {
    def props = [version: version, paperApiFamily: paperApiFamily]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveBaseName = 'modseeker'
    archiveVersion = version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('LICENSES')) {
        into 'META-INF/licenses'
    }
}

